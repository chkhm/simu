<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0b0b0b}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#52514e}
.head{font-size:13px;font-weight:700;fill:#52514e}.lbl{font-size:14px;font-weight:600}.small{font-size:12px;fill:#52514e}
