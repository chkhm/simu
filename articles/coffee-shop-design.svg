<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Design of the simu coffee-shop simulation: door and milk_run processes, one customer process per arrival, cashier Resource, barista PriorityResource and milk Container, all inside one SimEnv per day, run 200 times by monte_carlo::run.">
