<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24" y="42" class="title">What runs, what waits, what is shared</text>
<text x="24" y="68" class="sub">The coffee-shop model in simu: processes (blue) wait on shared resources (orange) and the milk container (green).</text>
<rect x="16" y="92" width="1168" height="588" rx="12" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="7 5"/><text x="34" y="116" class="head" text-anchor="start">monte_carlo::run(0..200, simulate_day)  ·  200 independent days per staffing level, spread over all CPU cores</text><rect x="56" y="152" width="1112" height="520" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="48" y="144" width="1112" height="520" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="40" y="136" width="1112" height="520" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="58" y="160" class="head" text-anchor="start">one SimEnv = one simulated day (one seed)</text><rect x="70" y="180" width="170" height="56" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="155.0" y="204" class="code" text-anchor="middle">door</text><text x="155.0" y="222" class="small" text-anchor="middle">process</text><path d="M772,180 v62 a60.0,12 0 0 0 120,0 v-62" fill="#e6f5ee" stroke="#1f9d6b" stroke-width="2"/><ellipse cx="832.0" cy="180" rx="60.0" ry="12" fill="#e6f5ee" stroke="#1f9d6b" stroke-width="2"/><text x="832.0" y="212" class="lbl" text-anchor="middle">milk fridge</text><text x="832.0" y="230" class="code" text-anchor="middle">Container</text><text x="832.0" y="246" class="small" text-anchor="middle">2 L × baristas</text><rect x="980" y="180" width="150" height="56" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="1055.0" y="204" class="code" text-anchor="middle">milk_run</text><text x="1055.0" y="222" class="small" text-anchor="middle">process</text><path d="M980,208 L898,208" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="936" y="200" class="small" text-anchor="middle">put: top up</text><text x="936" y="226" class="small" text-anchor="middle">every 30 min</text><rect x="60" y="296" width="1072" height="190" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="74" y="318" class="code" text-anchor="start">customer</text><text x="152" y="318" class="small" text-anchor="start">process · one per arrival</text><path d="M155,236 L155,368" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="165" y="262" class="small" text-anchor="start">spawn: ~1.7 per min</text><text x="165" y="278" class="small" text-anchor="start">until closing</text><circle cx="155" cy="394" r="12" fill="#ffffff" stroke="#52514e" stroke-width="2"/><text x="155" y="428" class="small" text-anchor="middle">arrive</text><rect x="200" y="372" width="200" height="44" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="300.0" y="392" class="lbl" text-anchor="middle">wait for cashier</text><text x="300.0" y="408" class="small" text-anchor="middle">any_of!( queue , patience )</text><rect x="430" y="372" width="110" height="44" rx="22" fill="#f1f0ec" stroke="#898781" stroke-width="2" /><text x="485.0" y="392" class="lbl" text-anchor="middle">order ~1 min</text><text x="485.0" y="408" class="small" text-anchor="middle">timeout</text><rect x="580" y="372" width="170" height="44" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="665.0" y="392" class="lbl" text-anchor="middle">wait for barista</text><text x="665.0" y="408" class="small" text-anchor="middle">priority 0 or 1</text><rect x="780" y="372" width="104" height="44" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="832.0" y="392" class="lbl" text-anchor="middle">take milk</text><text x="832.0" y="408" class="small" text-anchor="middle">60% of drinks</text><rect x="914" y="372" width="110" height="44" rx="22" fill="#f1f0ec" stroke="#898781" stroke-width="2" /><text x="969.0" y="392" class="lbl" text-anchor="middle">prep ~2 min</text><text x="969.0" y="408" class="small" text-anchor="middle">timeout</text><circle cx="1080" cy="394" r="12" fill="#52514e"/><text x="1080" y="428" class="small" text-anchor="middle">leave</text><path d="M167,394 L198,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M400,394 L428,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M540,394 L578,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M750,394 L778,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M884,394 L912,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M1024,394 L1066,394" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M160,362 C190,326 560,326 640,368" fill="none" stroke="#2a78d6" stroke-width="1.6"  marker-end="url(#a)"/><text x="400" y="360" class="small" text-anchor="middle">mobile order (30%): skip the cashier, wait at priority 1</text><path d="M228,416 L228,452" fill="none" stroke="#eb6834" stroke-width="1.6"  marker-end="url(#a)"/><line x1="220" y1="456" x2="236" y2="472" stroke="#eb6834" stroke-width="2.5"/><line x1="236" y1="456" x2="220" y2="472" stroke="#eb6834" stroke-width="2.5"/><text x="244" y="462" class="small" text-anchor="start">walks out</text><text x="244" y="477" class="small" text-anchor="start">(patience wins)</text><path d="M832,372 L832,268" fill="none" stroke="#1f9d6b" stroke-width="1.6"  marker-end="url(#a)"/><text x="842" y="330" class="small" text-anchor="start">get 0.25 L</text><text x="842" y="346" class="small" text-anchor="start">(waits if dry)</text><rect x="400" y="436" width="140" height="8" rx="4" fill="#eb6834"/><text x="470" y="460" class="small" text-anchor="middle">holds a cashier</text><rect x="750" y="436" width="274" height="8" rx="4" fill="#eb6834"/><text x="887" y="460" class="small" text-anchor="middle">holds a barista</text><rect x="250" y="530" width="330" height="104" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="2" /><text x="266" y="556" class="lbl" text-anchor="start">cashiers</text><text x="340" y="556" class="code" text-anchor="start">Resource(baristas.div_ceil(2))</text><circle cx="430" cy="588" r="7" fill="#ffffff" stroke="#52514e" stroke-width="1.2"/><circle cx="410" cy="588" r="7" fill="#ffffff" stroke="#52514e" stroke-width="1.2"/><circle cx="390" cy="588" r="7" fill="#ffffff" stroke="#52514e" stroke-width="1.2"/><text x="410" y="618" class="small" text-anchor="middle">FIFO queue</text><rect x="470" y="576" width="24" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><rect x="500" y="576" width="24" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><text x="500" y="618" class="small" text-anchor="middle">units</text><rect x="640" y="530" width="470" height="104" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="2" /><text x="656" y="556" class="lbl" text-anchor="start">baristas</text><text x="728" y="556" class="code" text-anchor="start">PriorityResource(baristas)</text><circle cx="850" cy="588" r="7" fill="#ffffff" stroke="#52514e" stroke-width="1.2"/><circle cx="830" cy="588" r="7" fill="#ffffff" stroke="#52514e" stroke-width="1.2"/><circle cx="810" cy="588" r="7" fill="#eaf2fc" stroke="#52514e" stroke-width="1.2"/><circle cx="790" cy="588" r="7" fill="#eaf2fc" stroke="#52514e" stroke-width="1.2"/><circle cx="770" cy="588" r="7" fill="#eaf2fc" stroke="#52514e" stroke-width="1.2"/><text x="810" y="618" class="small" text-anchor="middle">walk-ins (0) before mobile (1)</text><rect x="900" y="576" width="24" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><rect x="930" y="576" width="24" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><rect x="960" y="576" width="24" height="24" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><rect x="990" y="576" width="24" height="24" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="959" y="618" class="small" text-anchor="middle">units = baristas on shift</text><path d="M340,416 L340,526" fill="none" stroke="#eb6834" stroke-width="1.6"  marker-end="url(#a)"/><text x="348" y="518" class="small" text-anchor="start">request()</text><path d="M665,416 L665,526" fill="none" stroke="#eb6834" stroke-width="1.6"  marker-end="url(#a)"/><text x="673" y="518" class="small" text-anchor="start">request(priority)</text><rect x="24" y="694" width="28" height="20" rx="5" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="60" y="709" class="small" text-anchor="start">process: async code that waits</text><rect x="270" y="694" width="28" height="20" rx="4" fill="#fdeee7" stroke="#eb6834" stroke-width="2" /><text x="306" y="709" class="small" text-anchor="start">resource: units, queue, RAII release</text><rect x="540" y="694" width="28" height="20" rx="6" fill="#e6f5ee" stroke="#1f9d6b" stroke-width="2"/><text x="576" y="709" class="small" text-anchor="start">container: continuous amount</text><rect x="770" y="694" width="28" height="20" rx="10" fill="#f1f0ec" stroke="#898781" stroke-width="2" /><text x="806" y="709" class="small" text-anchor="start">timeout</text><rect x="870" y="700" width="28" height="8" rx="4" fill="#eb6834"/><text x="906" y="709" class="small" text-anchor="start">resource held (guard alive)</text><text x="24" y="738" class="foot" text-anchor="start">simu coffee_shop example · examples/coffee_shop.rs</text>
