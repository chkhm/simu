<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="862" viewBox="0 0 1200 862" role="img" aria-label="Call structure of the simu coffee-shop benchmark: main parses arguments and runs run_coffee once per seed, sequentially or with monte_carlo::run; run_coffee creates a SimEnv with a SplitMix64 random stream, spawns the arrivals and restock processes and runs them; arrivals spawns n customer processes. Markers show where it differs from the coffee_shop showcase.">
