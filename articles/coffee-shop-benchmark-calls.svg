<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0b0b0b}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#52514e}
.lbl{font-size:14px;font-weight:600}.small{font-size:12px;fill:#52514e}.badge{font-size:13px;font-weight:700;fill:#ffffff}.delta{font-size:13px;font-weight:700;fill:#ffffff}
.code{font-family:Menlo,Consolas,monospace;font-size:13px;font-weight:600}.uses{font-family:Menlo,Consolas,monospace;font-size:11px;fill:#52514e}.foot{font-size:11px;fill:#898781}</style>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24" y="42" class="title">The benchmark version: same structure, different randomness and run length</text>
<text x="24" y="68" class="sub">How the functions of coffee_shop_benchmark.rs call each other. Orange Δ markers show where it differs from coffee_shop.rs.</text>
<rect x="40" y="96" width="1120" height="112" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><circle cx="66" cy="124" r="13" fill="#0b0b0b"/><text x="66" y="129" class="badge" text-anchor="middle">1</text><text x="88" y="129" class="code" text-anchor="start">main()</text><text x="88" y="147" class="small" text-anchor="start">the experiment</text><rect x="200" y="124" width="200" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="300.0" y="148.0" class="code" text-anchor="middle">parse_args()</text><text x="300.0" y="165.0" class="small" text-anchor="middle">--customers --seeds --baristas</text><circle cx="398" cy="126" r="10" fill="#eb6834"/><text x="398" y="130.5" class="delta" text-anchor="middle">Δ</text><rect x="430" y="120" width="390" height="72" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="625.0" y="146.0" class="code" text-anchor="middle">(0..seeds).map(run)</text><text x="625.0" y="162.0" class="code" text-anchor="middle">--parallel: monte_carlo::run(0..seeds, run)</text><text x="625.0" y="179.0" class="small" text-anchor="middle">run = |seed| run_coffee(seed, customers, …)</text><circle cx="818" cy="122" r="10" fill="#eb6834"/><text x="818" y="126.5" class="delta" text-anchor="middle">Δ</text><rect x="850" y="124" width="290" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="995.0" y="148.0" class="code" text-anchor="middle">mean of Metrics</text><text x="995.0" y="165.0" class="small" text-anchor="middle">print metrics + events/s</text><circle cx="1138" cy="126" r="10" fill="#eb6834"/><text x="1138" y="130.5" class="delta" text-anchor="middle">Δ</text><path d="M400,150 L428,150" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M820,150 L848,150" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><rect x="60" y="292" width="1100" height="156" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="50" y="282" width="1100" height="156" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="40" y="272" width="1100" height="156" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><circle cx="66" cy="300" r="13" fill="#0b0b0b"/><text x="66" y="305" class="badge" text-anchor="middle">2</text><text x="88" y="305" class="code" text-anchor="start">run_coffee(seed, n, lambda, mu, servers) -> Metrics</text><text x="88" y="323" class="small" text-anchor="start">one replication · its own SimEnv, clock and random stream · single-threaded, no locks</text><rect x="60" y="344" width="210" height="66" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="165.0" y="367.0" class="code" text-anchor="middle">SimEnv::with_source(</text><text x="165.0" y="383.0" class="code" text-anchor="middle">SplitMix64::new(seed))</text><text x="165.0" y="400.0" class="small" text-anchor="middle">portable random stream</text><circle cx="268" cy="346" r="10" fill="#eb6834"/><text x="268" y="350.5" class="delta" text-anchor="middle">Δ</text><rect x="292" y="344" width="150" height="66" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="367.0" y="375.0" class="code" text-anchor="middle">Shop { … }</text><text x="367.0" y="392.0" class="small" text-anchor="middle">cashier, barista, milk</text><rect x="464" y="344" width="210" height="66" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="569.0" y="367.0" class="code" text-anchor="middle">env.spawn(arrivals)</text><text x="569.0" y="383.0" class="code" text-anchor="middle">env.spawn(restock)</text><text x="569.0" y="400.0" class="small" text-anchor="middle">root processes</text><rect x="696" y="344" width="150" height="66" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="771.0" y="375.0" class="code" text-anchor="middle">env.run()</text><text x="771.0" y="392.0" class="small" text-anchor="middle">until no events left</text><rect x="868" y="344" width="252" height="66" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="994.0" y="375.0" class="code" text-anchor="middle">Metrics { … }</text><text x="994.0" y="392.0" class="small" text-anchor="middle">the metrics SimPy computes</text><circle cx="1118" cy="346" r="10" fill="#eb6834"/><text x="1118" y="350.5" class="delta" text-anchor="middle">Δ</text><path d="M270,377 L290,377" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M442,377 L462,377" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M674,377 L694,377" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M846,377 L866,377" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630,194 L590,268" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630,194 L630,268" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630,194 L670,268" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="570" y="236" class="small" text-anchor="end">seed 0, 1, … seeds−1</text><text x="570" y="252" class="small" text-anchor="end">one core, or all with --parallel</text><path d="M1060,344 L1060,212" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="1068" y="250" class="code" text-anchor="start">Metrics</text><text x="1068" y="266" class="small" text-anchor="start">(in seed order)</text><rect x="40" y="480" width="1120" height="262" rx="10" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3 4"/><circle cx="66" cy="508" r="13" fill="#0b0b0b"/><text x="66" y="513" class="badge" text-anchor="middle">3</text><text x="88" y="513" class="code" text-anchor="start">async processes</text><text x="88" y="532" class="small" text-anchor="start">executed by env.run(),</text><text x="88" y="548" class="small" text-anchor="start">interleaved by simulated time</text><rect x="310" y="566" width="200" height="102" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="410.0" y="590" class="code" text-anchor="middle">restock</text><text x="410.0" y="607" class="small" text-anchor="middle">process</text><line x1="324" y1="618" x2="496" y2="618" stroke="#c9c7bf"/><text x="410.0" y="636" class="uses" text-anchor="middle">timeout(30)</text><text x="410.0" y="651" class="uses" text-anchor="middle">milk.put(top_up)</text><circle cx="508" cy="568" r="10" fill="#eb6834"/><text x="508" y="572.5" class="delta" text-anchor="middle">Δ</text><text x="410" y="686" class="small" text-anchor="middle">stops when all n customers left</text><rect x="560" y="566" width="230" height="117" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="675.0" y="590" class="code" text-anchor="middle">arrivals</text><text x="675.0" y="607" class="small" text-anchor="middle">process · n customers</text><line x1="574" y1="618" x2="776" y2="618" stroke="#c9c7bf"/><text x="675.0" y="636" class="uses" text-anchor="middle">sample::exponential(gap)</text><text x="675.0" y="651" class="uses" text-anchor="middle">+ 5 draws per customer</text><text x="675.0" y="666" class="uses" text-anchor="middle">env.spawn(customer)</text><circle cx="788" cy="568" r="10" fill="#eb6834"/><text x="788" y="572.5" class="delta" text-anchor="middle">Δ</text><text x="675" y="701" class="small" text-anchor="middle">fixed count instead of an 8-hour day</text><rect x="840" y="566" width="280" height="132" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="980.0" y="590" class="code" text-anchor="middle">customer</text><text x="980.0" y="607" class="small" text-anchor="middle">process · one per arrival</text><line x1="854" y1="618" x2="1106" y2="618" stroke="#c9c7bf"/><text x="980.0" y="636" class="uses" text-anchor="middle">any_of!(cashier.request(),</text><text x="980.0" y="651" class="uses" text-anchor="middle">timeout(patience))</text><text x="980.0" y="666" class="uses" text-anchor="middle">barista.request(priority)</text><text x="980.0" y="681" class="uses" text-anchor="middle">milk.get(0.25) · timeout(prep)</text><text x="980" y="716" class="small" text-anchor="middle">same logic; patience race inlined</text><path d="M510,410 L420,562" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M610,410 L660,562" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="545" y="466" class="small" text-anchor="middle">spawn</text><path d="M790,592 L838,592" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="814" y="612" class="small" text-anchor="middle">spawn</text><line x1="24" y1="776" x2="62" y2="776" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/><text x="70" y="781" class="small" text-anchor="start">calls / returns</text><line x1="180" y1="776" x2="218" y2="776" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="226" y="781" class="small" text-anchor="start">env.spawn: starts a process</text><rect x="428" y="772" width="26" height="16" rx="3" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="424" y="768" width="26" height="16" rx="3" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="420" y="764" width="26" height="16" rx="3" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="462" y="781" class="small" text-anchor="start">runs once per seed</text><rect x="600" y="766" width="28" height="20" rx="5" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="636" y="781" class="small" text-anchor="start">async process</text><rect x="750" y="766" width="28" height="20" rx="5" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="786" y="781" class="small" text-anchor="start">plain function</text><circle cx="910" cy="776" r="10" fill="#eb6834"/><text x="910" y="780.5" class="delta" text-anchor="middle">Δ</text><text x="926" y="781" class="small" text-anchor="start">differs from coffee_shop.rs</text><text x="24" y="822" class="small" text-anchor="start">Same three levels as the showcase. Details of every difference: examples/coffee_shop_benchmark.md</text><text x="24" y="848" class="foot" text-anchor="start">simu coffee_shop_benchmark example · examples/coffee_shop_benchmark.rs</text>
</svg>