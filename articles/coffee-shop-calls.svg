<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="Call structure of the simu coffee-shop example: main loops over staffing levels and calls monte_carlo::run, which runs simulate_day once per seed in parallel; simulate_day builds a SimEnv, spawns the milk_run and door processes and runs them; door spawns one customer process per arrival, which awaits the wait_for_cashier helper.">
