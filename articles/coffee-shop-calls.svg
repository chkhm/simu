<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0b0b0b}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#52514e}
.lbl{font-size:14px;font-weight:600}.small{font-size:12px;fill:#52514e}.badge{font-size:13px;font-weight:700;fill:#ffffff}
.code{font-family:Menlo,Consolas,monospace;font-size:13px;font-weight:600}.uses{font-family:Menlo,Consolas,monospace;font-size:11px;fill:#52514e}.foot{font-size:11px;fill:#898781}</style>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24" y="42" class="title">Three levels of a Monte Carlo simulation</text>
<text x="24" y="68" class="sub">How the functions of the coffee-shop example call each other: experiment → one replication per seed → async processes.</text>
<rect x="40" y="96" width="1120" height="104" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><circle cx="66" cy="124" r="13" fill="#0b0b0b"/><text x="66" y="129" class="badge" text-anchor="middle">1</text><text x="88" y="129" class="code" text-anchor="start">main()</text><text x="88" y="147" class="small" text-anchor="start">the experiment</text><rect x="210" y="122" width="220" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="320.0" y="146.0" class="code" text-anchor="middle">for baristas in 3..=6</text><text x="320.0" y="163.0" class="small" text-anchor="middle">one row per staffing level</text><rect x="470" y="122" width="340" height="60" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="640.0" y="149.0" class="code" text-anchor="middle">monte_carlo::run(0..200,</text><text x="640.0" y="165.0" class="code" text-anchor="middle">|seed| simulate_day(seed, baristas))</text><rect x="850" y="122" width="290" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="995.0" y="146.0" class="code" text-anchor="middle">mean of 200 DayResults</text><text x="995.0" y="163.0" class="small" text-anchor="middle">print one table row</text><path d="M430,148 L468,148" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M810,148 L848,148" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><rect x="60" y="282" width="1100" height="156" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="50" y="272" width="1100" height="156" rx="10" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="40" y="262" width="1100" height="156" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><circle cx="66" cy="290" r="13" fill="#0b0b0b"/><text x="66" y="295" class="badge" text-anchor="middle">2</text><text x="88" y="295" class="code" text-anchor="start">simulate_day(seed, baristas) -> DayResult</text><text x="88" y="313" class="small" text-anchor="start">one replication · its own SimEnv, clock and RNG · single-threaded, no locks</text><rect x="60" y="336" width="190" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="155.0" y="360.0" class="code" text-anchor="middle">SimEnv::with_seed(seed)</text><text x="155.0" y="377.0" class="small" text-anchor="middle">own clock + RNG</text><rect x="272" y="336" width="160" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="352.0" y="360.0" class="code" text-anchor="middle">Shop { … }</text><text x="352.0" y="377.0" class="small" text-anchor="middle">cashiers, baristas, fridge</text><rect x="454" y="336" width="220" height="60" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="564.0" y="356.0" class="code" text-anchor="middle">env.spawn(milk_run)</text><text x="564.0" y="372.0" class="code" text-anchor="middle">env.spawn(door)</text><text x="564.0" y="389.0" class="small" text-anchor="middle">root processes</text><rect x="696" y="336" width="160" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="776.0" y="360.0" class="code" text-anchor="middle">env.run()</text><text x="776.0" y="377.0" class="small" text-anchor="middle">until no events left</text><rect x="878" y="336" width="242" height="52" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="999.0" y="360.0" class="code" text-anchor="middle">read stats</text><text x="999.0" y="377.0" class="small" text-anchor="middle">→ DayResult</text><path d="M250,362 L270,362" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M432,362 L452,362" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M674,362 L694,362" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M856,362 L876,362" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M640,182 L600,258" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M640,182 L640,258" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><path d="M640,182 L680,258" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="580" y="228" class="small" text-anchor="end">seed 0, 1, … 199</text><text x="580" y="244" class="small" text-anchor="end">on all CPU cores</text><path d="M1060,336 L1060,186" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="1068" y="240" class="code" text-anchor="start">DayResult</text><text x="1068" y="256" class="small" text-anchor="start">(in seed order)</text><rect x="40" y="470" width="1120" height="344" rx="10" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3 4"/><circle cx="66" cy="498" r="13" fill="#0b0b0b"/><text x="66" y="503" class="badge" text-anchor="middle">3</text><text x="88" y="503" class="code" text-anchor="start">async processes</text><text x="88" y="522" class="small" text-anchor="start">executed by env.run(),</text><text x="88" y="538" class="small" text-anchor="start">interleaved by simulated time</text><rect x="330" y="548" width="180" height="102" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="420.0" y="572" class="code" text-anchor="middle">milk_run</text><text x="420.0" y="589" class="small" text-anchor="middle">process</text><line x1="344" y1="600" x2="496" y2="600" stroke="#c9c7bf"/><text x="420.0" y="618" class="uses" text-anchor="middle">timeout(30)</text><text x="420.0" y="633" class="uses" text-anchor="middle">fridge.put(top_up)</text><rect x="560" y="548" width="180" height="102" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="650.0" y="572" class="code" text-anchor="middle">door</text><text x="650.0" y="589" class="small" text-anchor="middle">process</text><line x1="574" y1="600" x2="726" y2="600" stroke="#c9c7bf"/><text x="650.0" y="618" class="uses" text-anchor="middle">timeout(gap)</text><text x="650.0" y="633" class="uses" text-anchor="middle">env.spawn(customer)</text><rect x="810" y="548" width="250" height="102" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="935.0" y="572" class="code" text-anchor="middle">customer</text><text x="935.0" y="589" class="small" text-anchor="middle">process · one per arrival</text><line x1="824" y1="600" x2="1046" y2="600" stroke="#c9c7bf"/><text x="935.0" y="618" class="uses" text-anchor="middle">baristas.request(priority)</text><text x="935.0" y="633" class="uses" text-anchor="middle">fridge.get(0.25) · timeout(prep)</text><rect x="810" y="690" width="250" height="102" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="935.0" y="714" class="code" text-anchor="middle">wait_for_cashier</text><text x="935.0" y="731" class="small" text-anchor="middle">helper</text><line x1="824" y1="742" x2="1046" y2="742" stroke="#c9c7bf"/><text x="935.0" y="760" class="uses" text-anchor="middle">any_of!(cashiers.request(),</text><text x="935.0" y="775" class="uses" text-anchor="middle">timeout(patience))</text><path d="M500,396 L420,544" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M630,396 L650,544" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="535" y="458" class="small" text-anchor="middle">spawn</text><path d="M740,574 L808,574" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="774" y="564" class="small" text-anchor="middle">spawn</text><path d="M935,650 L935,688" fill="none" stroke="#52514e" stroke-width="1.6"  marker-end="url(#a)"/><text x="945" y="674" class="small" text-anchor="start">.await (walk-ins only)</text><line x1="24" y1="842" x2="62" y2="842" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/><text x="70" y="847" class="small" text-anchor="start">calls / returns</text><line x1="190" y1="842" x2="228" y2="842" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="236" y="847" class="small" text-anchor="start">env.spawn: starts a process</text><rect x="448" y="838" width="26" height="16" rx="3" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="444" y="834" width="26" height="16" rx="3" fill="#fcfcfb" stroke="#c9c7bf" stroke-width="2" /><rect x="440" y="830" width="26" height="16" rx="3" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="482" y="847" class="small" text-anchor="start">runs once per seed, in parallel</text><rect x="700" y="832" width="28" height="20" rx="5" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2" /><text x="736" y="847" class="small" text-anchor="start">async process</text><rect x="860" y="832" width="28" height="20" rx="5" fill="#ffffff" stroke="#52514e" stroke-width="2" /><text x="896" y="847" class="small" text-anchor="start">plain function or helper</text><text x="24" y="872" class="foot" text-anchor="start">simu coffee_shop example · examples/coffee_shop.rs</text>
</svg>