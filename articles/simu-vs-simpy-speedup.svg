<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24" y="40" class="t">How many times faster than SimPy?</text>
<text x="24" y="64" class="s">Wall-clock speedup of simu over SimPy on identical models drawing identical random numbers</text>
<line x1="300.0" y1="100" x2="300.0" y2="376" stroke="#e1e0d9"/><text x="300.0" y="394" class="ax" text-anchor="middle">0×</text><line x1="406.0" y1="100" x2="406.0" y2="376" stroke="#e1e0d9"/><text x="406.0" y="394" class="ax" text-anchor="middle">10×</text><line x1="512.0" y1="100" x2="512.0" y2="376" stroke="#e1e0d9"/><text x="512.0" y="394" class="ax" text-anchor="middle">20×</text><line x1="618.0" y1="100" x2="618.0" y2="376" stroke="#e1e0d9"/><text x="618.0" y="394" class="ax" text-anchor="middle">30×</text><line x1="724.0" y1="100" x2="724.0" y2="376" stroke="#e1e0d9"/><text x="724.0" y="394" class="ax" text-anchor="middle">40×</text><line x1="830.0" y1="100" x2="830.0" y2="376" stroke="#e1e0d9"/><text x="830.0" y="394" class="ax" text-anchor="middle">50×</text>
<text x="24" y="110" class="grp">Single thread, one long run</text><text x="288" y="147" class="lbl" text-anchor="end">M/M/1 queue</text><path d="M300,132 h128.5 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-128.5 z" fill="#2a78d6"/><text x="440.5" y="149" class="val">12.5×</text><text x="288" y="183" class="lbl" text-anchor="end">M/M/2 queue</text><path d="M300,168 h133.8 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-133.8 z" fill="#2a78d6"/><text x="445.8" y="185" class="val">13.0×</text><text x="288" y="219" class="lbl" text-anchor="end">Priority queue</text><path d="M300,204 h148.6 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-148.6 z" fill="#2a78d6"/><text x="460.6" y="221" class="val">14.4×</text><text x="288" y="255" class="lbl" text-anchor="end">Coffee shop</text><path d="M300,240 h185.7 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-185.7 z" fill="#2a78d6"/><text x="497.7" y="257" class="val">17.9×</text><text x="24" y="286" class="grp">Many runs in parallel, 10 cores</text><text x="288" y="323" class="lbl" text-anchor="end">M/M/1, 300 runs</text><path d="M300,308 h270.5 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-270.5 z" fill="#2a78d6"/><text x="582.5" y="325" class="val">25.9×</text><text x="288" y="359" class="lbl" text-anchor="end">Coffee shop, 1,000 days</text><path d="M300,344 h449.7 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-449.7 z" fill="#2a78d6"/><text x="761.7" y="361" class="val">42.8×</text>
<text x="24" y="414" class="n">Apple M4 (10 cores), macOS 26.7, CPython 3.14.8 + SimPy 4.1.2, rustc 1.96 --release · reproduce: compare/run_comparison.sh</text>
