version = 1

# Bulk annotation for prose and uncommentable files: markdown docs, .gitignore
# files, the cargo-regenerated lockfile, and the pip requirements list.
[[annotations]]
path = [
    "**/*.md",
    ".gitignore",
    "compare/.gitignore",
    "Cargo.lock",
    "compare/requirements.txt",
    "llms.txt",
    "articles/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) Siemens 2026 contributed by Christoph Kuhmuench christoph.kuhmuench@gmail.com"
SPDX-License-Identifier = "MIT OR Apache-2.0"
