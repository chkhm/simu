[package]
# crates.io package is `simu-des` (the name `simu` is taken); the library
# target below stays `simu`, so users depend on simu-des but `use simu::…`.
name = "simu-des"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Discrete-event simulation for Rust, inspired by SimPy — single-threaded async executor, resources, and Monte Carlo parallelism."
repository = "https://github.com/chkhm/simu"
homepage = "https://github.com/chkhm/simu"
readme = "README.md"
keywords = ["simulation", "discrete-event", "des", "simpy", "monte-carlo"]
categories = ["simulation", "science", "concurrency"]
authors = ["Christoph Kuhmuench <christoph.kuhmuench@gmail.com>"]
rust-version = "1.82"
# Keep the published tarball lean — compare/ alone is ~147 MB.
exclude = [
    "compare/",
    "reviews/",
    "articles/",
    ".github/",
    "target/",
    ".claude/",
    "PLAN.md",
    "TESTING.md",
    "CLAUDE.md",
    "PUBLISHING.md",
]

[package.metadata.docs.rs]
# Document the monte-carlo feature path too.
all-features = true

[lib]
name = "simu"
path = "src/lib.rs"

[features]
monte-carlo = ["dep:rayon"]

[dependencies]
rand = "0.9"
rand_distr = "0.5"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false
